<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <!-- 宣纸/古绢底纹与渐变 -->
    <linearGradient id="silkBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F1E3" />
      <stop offset="35%" stop-color="#EFE6D2" />
      <stop offset="70%" stop-color="#E5D9BD" />
      <stop offset="100%" stop-color="#D9C9A8" />
    </linearGradient>

    <!-- 远山水墨浓淡 -->
    <linearGradient id="inkFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5C6670" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#2D3748" stop-opacity="0.65" />
    </linearGradient>
    <linearGradient id="inkMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A5568" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1A202C" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="inkRobe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2D3748" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- 柔光与雾霭 -->
    <radialGradient id="mistGlow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#FFFDF8" stop-opacity="0.7" />
      <stop offset="60%" stop-color="#EFE6D2" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#D9C9A8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. 绢本宣纸底色 -->
  <rect width="600" height="800" fill="url(#silkBg)" />
  <rect width="600" height="800" fill="url(#mistGlow)" />

  <!-- 边框双水墨边饰 -->
  <rect x="20" y="20" width="560" height="760" fill="none" stroke="#8C7A5B" stroke-width="1.5" stroke-opacity="0.4" />
  <rect x="25" y="25" width="550" height="750" fill="none" stroke="#8C7A5B" stroke-width="0.8" stroke-dasharray="8 4" stroke-opacity="0.3" />

  <!-- 2. 背景山川水墨意境 (秦岭巴山连绵远山) -->
  <path d="M-50,380 Q100,240 280,310 T650,280 L650,550 L-50,550 Z" fill="url(#inkFar)" />
  <path d="M-20,440 Q150,340 320,400 T620,360 L620,620 L-20,620 Z" fill="url(#inkMid)" />

  <!-- 归雁与微风萧萧 -->
  <path d="M120,160 Q130,152 140,160 Q150,152 160,160" fill="none" stroke="#4A5568" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  <path d="M150,140 Q158,133 166,140 Q174,133 182,140" fill="none" stroke="#4A5568" stroke-width="1.2" stroke-linecap="round" opacity="0.5" />
  <path d="M175,170 Q182,164 190,170 Q198,164 205,170" fill="none" stroke="#4A5568" stroke-width="1.2" stroke-linecap="round" opacity="0.4" />

  <!-- 3. 诗圣杜甫人物造像 (水墨工笔长袍与葛巾) -->
  <g transform="translate(180, 220)">
    <!-- 头部与唐式葛巾 -->
    <!-- 葛巾下垂飘带 -->
    <path d="M125,120 Q110,200 100,270" fill="none" stroke="#1A202C" stroke-width="5" stroke-linecap="round" opacity="0.9" />
    <path d="M128,125 Q135,210 142,280" fill="none" stroke="#2D3748" stroke-width="4" stroke-linecap="round" opacity="0.8" />

    <!-- 葛巾主体 -->
    <path d="M105,75 C95,50 145,20 165,45 C180,35 195,65 185,85 C175,100 115,100 105,75 Z" fill="#1A202C" />

    <!-- 面部轮廓 (清瘦面庞、沉毅目光、微须) -->
    <path d="M125,75 Q150,85 160,110 Q162,145 145,170 Q130,175 120,165 Q115,125 125,75 Z" fill="#E2D4BA" stroke="#4A5568" stroke-width="1" />
    <!-- 忧思微蹙之双眉与双目 -->
    <path d="M136,105 Q145,103 154,106" fill="none" stroke="#1A202C" stroke-width="2.5" stroke-linecap="round" />
    <path d="M138,114 Q146,112 153,115" fill="none" stroke="#1A202C" stroke-width="1.8" stroke-linecap="round" />
    <!-- 清瘦长须 -->
    <path d="M135,160 Q145,195 140,230 Q130,205 128,165 Z" fill="#2D3748" opacity="0.9" />
    <path d="M142,165 Q152,210 148,245" fill="none" stroke="#1A202C" stroke-width="1.5" />

    <!-- 宽袍大袖 (布衣长衫、博大仁者气度) -->
    <path d="M120,175 C80,210 20,290 0,380 C40,400 90,380 120,330 L110,540 C140,550 200,550 240,540 L230,330 C260,370 300,390 330,370 C310,280 250,210 210,175 Z" fill="url(#inkRobe)" />

    <!-- 衣褶线条 -->
    <path d="M120,195 Q145,260 140,380" fill="none" stroke="#4B5563" stroke-width="1.8" opacity="0.6" />
    <path d="M210,195 Q185,260 190,380" fill="none" stroke="#4B5563" stroke-width="1.8" opacity="0.6" />
    <path d="M70,300 Q110,340 140,380" fill="none" stroke="#374151" stroke-width="1.5" opacity="0.7" />
    <path d="M260,300 Q220,340 190,380" fill="none" stroke="#374151" stroke-width="1.5" opacity="0.7" />

    <!-- 手执诗卷与胸怀天下 -->
    <rect x="150" y="290" width="30" height="90" rx="6" transform="rotate(-15 150 290)" fill="#EDE2CA" stroke="#8C7A5B" stroke-width="1.5" />
    <line x1="158" y1="305" x2="175" y2="300" stroke="#8C7A5B" stroke-width="1" />
    <line x1="160" y1="325" x2="177" y2="320" stroke="#8C7A5B" stroke-width="1" />
  </g>

  <!-- 4. 题诗书法 (右侧竖排朱砂行楷) -->
  <g transform="translate(480, 90)">
    <!-- 诗名 -->
    <text x="0" y="0" font-family="serif" font-size="20" font-weight="bold" fill="#1F2937" letter-spacing="4">杜</text>
    <text x="0" y="32" font-family="serif" font-size="20" font-weight="bold" fill="#1F2937" letter-spacing="4">少</text>
    <text x="0" y="64" font-family="serif" font-size="20" font-weight="bold" fill="#1F2937" letter-spacing="4">陵</text>
    <text x="0" y="96" font-family="serif" font-size="20" font-weight="bold" fill="#1F2937" letter-spacing="4">像</text>

    <!-- 传世名句 -->
    <g transform="translate(-40, 20)" font-family="serif" font-size="14" fill="#4B5563" letter-spacing="3" opacity="0.85">
      <text x="0" y="0">国</text>
      <text x="0" y="24">破</text>
      <text x="0" y="48">山</text>
      <text x="0" y="72">河</text>
      <text x="0" y="96">在</text>
      <text x="0" y="130">城</text>
      <text x="0" y="154">春</text>
      <text x="0" y="178">草</text>
      <text x="0" y="202">木</text>
      <text x="0" y="226">深</text>
    </g>

    <g transform="translate(-75, 50)" font-family="serif" font-size="13" fill="#6B7280" letter-spacing="3" opacity="0.75">
      <text x="0" y="0">安</text>
      <text x="0" y="22">得</text>
      <text x="0" y="44">广</text>
      <text x="0" y="66">厦</text>
      <text x="0" y="88">千</text>
      <text x="0" y="110">万</text>
      <text x="0" y="132">间</text>
      <text x="0" y="164">大</text>
      <text x="0" y="186">庇</text>
      <text x="0" y="208">天</text>
      <text x="0" y="230">下</text>
      <text x="0" y="252">寒</text>
      <text x="0" y="274">士</text>
    </g>
  </g>

  <!-- 5. 朱砂印章 (左下角与右上角落款) -->
  <!-- “诗圣”朱文印 -->
  <g transform="translate(60, 640)">
    <rect width="52" height="52" rx="4" fill="#B91C1C" opacity="0.88" />
    <rect x="3" y="3" width="46" height="46" rx="2" fill="none" stroke="#FDE047" stroke-width="1.2" opacity="0.7" />
    <text x="10" y="25" font-family="serif" font-size="17" font-weight="bold" fill="#FEF2F2">诗</text>
    <text x="28" y="25" font-family="serif" font-size="17" font-weight="bold" fill="#FEF2F2">史</text>
    <text x="10" y="44" font-family="serif" font-size="17" font-weight="bold" fill="#FEF2F2">少</text>
    <text x="28" y="44" font-family="serif" font-size="17" font-weight="bold" fill="#FEF2F2">陵</text>
  </g>

  <!-- “大唐工部”白文印 -->
  <g transform="translate(60, 705)">
    <rect width="48" height="48" rx="3" fill="#991B1B" opacity="0.85" />
    <text x="8" y="23" font-family="serif" font-size="15" font-weight="bold" fill="#FFF">工</text>
    <text x="26" y="23" font-family="serif" font-size="15" font-weight="bold" fill="#FFF">部</text>
    <text x="8" y="41" font-family="serif" font-size="15" font-weight="bold" fill="#FFF">草</text>
    <text x="26" y="41" font-family="serif" font-size="15" font-weight="bold" fill="#FFF">堂</text>
  </g>
</svg>
