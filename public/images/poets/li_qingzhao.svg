<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <!-- 宣纸/青瓷绢本底纹与渐变 -->
    <linearGradient id="silkBgSong" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF6EE" />
      <stop offset="35%" stop-color="#F2ECE0" />
      <stop offset="70%" stop-color="#E8DFCF" />
      <stop offset="100%" stop-color="#DCD0BD" />
    </linearGradient>

    <!-- 天青宋瓷与湖水晕染 -->
    <linearGradient id="lakeMist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F766E" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#14B8A6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0F766E" stop-opacity="0.55" />
    </linearGradient>

    <!-- 婉约罗裙渐变 -->
    <linearGradient id="skirtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="50%" stop-color="#1F2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="gauzeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CBD5E1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.4" />
    </linearGradient>

    <!-- 柔和月色/清晓微光 -->
    <radialGradient id="lotusGlow" cx="0.4" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#FFFDF9" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#F2ECE0" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#DCD0BD" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. 绢本宣纸底色 -->
  <rect width="600" height="800" fill="url(#silkBgSong)" />
  <rect width="600" height="800" fill="url(#lotusGlow)" />

  <!-- 边框宋锦边饰 -->
  <rect x="20" y="20" width="560" height="760" fill="none" stroke="#9A8464" stroke-width="1.5" stroke-opacity="0.4" />
  <rect x="25" y="25" width="550" height="750" fill="none" stroke="#0F766E" stroke-width="0.8" stroke-dasharray="6 3" stroke-opacity="0.35" />

  <!-- 2. 背景意境 (荷塘藕花、垂杨微波、惊飞鸥鹭) -->
  <path d="M-50,420 Q120,320 280,360 T650,330 L650,560 L-50,560 Z" fill="url(#lakeMist)" />

  <!-- 荷叶水墨轮廓 -->
  <path d="M60,540 C90,520 150,530 180,560 C140,580 80,570 60,540 Z" fill="#2E5A54" opacity="0.3" />
  <path d="M420,530 C460,505 520,520 540,550 C500,575 440,560 420,530 Z" fill="#2E5A54" opacity="0.35" />
  <!-- 水波倒影 -->
  <path d="M30,590 Q180,580 340,590 T600,585" fill="none" stroke="#0F766E" stroke-width="1.2" opacity="0.3" />
  <path d="M0,630 Q150,620 300,630 T580,625" fill="none" stroke="#0F766E" stroke-width="1" opacity="0.25" />

  <!-- 惊起飞翔的白鸥 -->
  <path d="M100,200 Q112,190 125,200 Q138,190 150,200" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round" opacity="0.65" />
  <path d="M135,175 Q145,166 156,175 Q167,166 178,175" fill="none" stroke="#475569" stroke-width="1.3" stroke-linecap="round" opacity="0.55" />
  <path d="M160,210 Q168,203 177,210 Q186,203 195,210" fill="none" stroke="#475569" stroke-width="1.2" stroke-linecap="round" opacity="0.45" />

  <!-- 3. 才女李清照人物造像 (宋制背子、修长裙袍、清丽端雅) -->
  <g transform="translate(185, 200)">
    <!-- 发髻与玉簪 -->
    <!-- 发髻 -->
    <ellipse cx="115" cy="55" rx="35" ry="30" fill="#18181B" />
    <ellipse cx="115" cy="35" rx="20" ry="22" fill="#18181B" />
    <!-- 碧玉簪子 -->
    <path d="M75,30 L155,42" stroke="#0D9488" stroke-width="3" stroke-linecap="round" />
    <circle cx="75" cy="30" r="3.5" fill="#5EEAD4" />

    <!-- 面部与修长颈项 (古典婉约鹅蛋脸) -->
    <path d="M98,58 Q125,65 132,88 Q135,120 120,140 Q105,145 98,135 Q90,95 98,58 Z" fill="#F5EBD7" stroke="#64748B" stroke-width="0.8" />
    <!-- 娥眉与星眸 -->
    <path d="M108,82 Q117,79 125,83" fill="none" stroke="#1E293B" stroke-width="2" stroke-linecap="round" />
    <path d="M110,92 Q118,90 124,93" fill="none" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round" />
    <path d="M120,118 Q123,122 120,125" fill="none" stroke="#B91C1C" stroke-width="1.5" stroke-linecap="round" />

    <!-- 领口与交领 -->
    <path d="M95,140 L115,180 L135,140 Z" fill="#E2E8F0" />
    <path d="M105,140 L115,165" stroke="#94A3B8" stroke-width="1" />

    <!-- 外罩宋制背子长衫与大袖 -->
    <path d="M95,145 C65,185 20,250 5,340 C35,355 75,335 100,295 L88,570 C125,580 180,580 215,570 L202,295 C225,335 265,355 295,340 C280,250 235,185 205,145 Z" fill="url(#skirtGrad)" />

    <!-- 披帛 (天青色水墨纱罗) -->
    <path d="M90,165 Q45,260 65,390 Q75,460 70,550" fill="none" stroke="url(#gauzeGrad)" stroke-width="12" stroke-linecap="round" opacity="0.65" />
    <path d="M210,165 Q255,260 235,390 Q225,460 230,550" fill="none" stroke="url(#gauzeGrad)" stroke-width="12" stroke-linecap="round" opacity="0.65" />

    <!-- 衣纹褶线 -->
    <path d="M110,185 Q135,270 130,420" fill="none" stroke="#64748B" stroke-width="1.4" opacity="0.5" />
    <path d="M190,185 Q165,270 170,420" fill="none" stroke="#64748B" stroke-width="1.4" opacity="0.5" />

    <!-- 纤手执卷 (手捧宋版书卷) -->
    <rect x="135" y="270" width="26" height="85" rx="5" transform="rotate(-12 135 270)" fill="#EDE2CA" stroke="#8C7A5B" stroke-width="1.5" />
    <line x1="142" y1="285" x2="157" y2="282" stroke="#8C7A5B" stroke-width="1" />
    <line x1="144" y1="305" x2="159" y2="302" stroke="#8C7A5B" stroke-width="1" />
  </g>

  <!-- 4. 题词书法 (右侧竖排古典词调) -->
  <g transform="translate(480, 85)">
    <!-- 词人号 -->
    <text x="0" y="0" font-family="serif" font-size="20" font-weight="bold" fill="#1F2937" letter-spacing="4">李</text>
    <text x="0" y="32" font-family="serif" font-size="20" font-weight="bold" fill="#1F2937" letter-spacing="4">易</text>
    <text x="0" y="64" font-family="serif" font-size="20" font-weight="bold" fill="#1F2937" letter-spacing="4">安</text>
    <text x="0" y="96" font-family="serif" font-size="20" font-weight="bold" fill="#1F2937" letter-spacing="4">像</text>

    <!-- 名句 -->
    <g transform="translate(-40, 20)" font-family="serif" font-size="14" fill="#0F766E" letter-spacing="3" opacity="0.9">
      <text x="0" y="0">生</text>
      <text x="0" y="24">当</text>
      <text x="0" y="48">作</text>
      <text x="0" y="72">人</text>
      <text x="0" y="96">杰</text>
      <text x="0" y="130">死</text>
      <text x="0" y="154">亦</text>
      <text x="0" y="178">为</text>
      <text x="0" y="202">鬼</text>
      <text x="0" y="226">雄</text>
    </g>

    <g transform="translate(-75, 45)" font-family="serif" font-size="13" fill="#64748B" letter-spacing="3" opacity="0.8">
      <text x="0" y="0">争</text>
      <text x="0" y="22">渡</text>
      <text x="0" y="44">争</text>
      <text x="0" y="66">渡</text>
      <text x="0" y="98">惊</text>
      <text x="0" y="120">起</text>
      <text x="0" y="142">一</text>
      <text x="0" y="164">滩</text>
      <text x="0" y="186">鸥</text>
      <text x="0" y="208">鹭</text>
    </g>
  </g>

  <!-- 5. 朱砂与天青印鉴 -->
  <!-- “易安居士”朱文印 -->
  <g transform="translate(60, 640)">
    <rect width="52" height="52" rx="4" fill="#BE123C" opacity="0.88" />
    <rect x="3" y="3" width="46" height="46" rx="2" fill="none" stroke="#FDE047" stroke-width="1.2" opacity="0.7" />
    <text x="10" y="25" font-family="serif" font-size="17" font-weight="bold" fill="#FFF">易</text>
    <text x="28" y="25" font-family="serif" font-size="17" font-weight="bold" fill="#FFF">安</text>
    <text x="10" y="44" font-family="serif" font-size="17" font-weight="bold" fill="#FFF">居</text>
    <text x="28" y="44" font-family="serif" font-size="17" font-weight="bold" fill="#FFF">士</text>
  </g>

  <!-- “金石名媛”天青印 -->
  <g transform="translate(60, 705)">
    <rect width="48" height="48" rx="3" fill="#0F766E" opacity="0.85" />
    <text x="8" y="23" font-family="serif" font-size="15" font-weight="bold" fill="#FFF">金</text>
    <text x="26" y="23" font-family="serif" font-size="15" font-weight="bold" fill="#FFF">石</text>
    <text x="8" y="41" font-family="serif" font-size="15" font-weight="bold" fill="#FFF">名</text>
    <text x="26" y="41" font-family="serif" font-size="15" font-weight="bold" fill="#FFF">家</text>
  </g>
</svg>
