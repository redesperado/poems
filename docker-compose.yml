services:
  # ============================================================================
  # 1. 核心关系数据库: PostgreSQL 16
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: tang_song_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: tang_song_poems
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 自动执行初始高扩展性表结构迁移
      - ./server/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tang_song_poems"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 2. Rust 后端服务 (可选: 容器化构建运行)
  # ============================================================================
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: tang_song_rust_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/tang_song_poems
      PORT: 8080
      CORS_ORIGIN: "*"
      RUST_LOG: info,poetry_server=debug
    ports:
      - "8080:8080"

volumes:
  pgdata:
    driver: local
